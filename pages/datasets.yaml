# The dataset repositories listed on the site's Datasets page.
# Refreshed from each repo's dataset.yaml by `python pages/build.py --refresh-datasets ../pdt-*`,
# which keeps `repo` and `site`. Add those two by hand when a repository is published.
intro: |
  Each dataset gets its own repository, named `pdt-<id>`, built from the same
  [template](templates/) and checked against the same [standard](STANDARD.md). A repository holds
  the dataset's metadata records, the three generated forms of access (a site, agent files and a
  data-dict export), and the data or a script to download it, as the publisher's terms allow.

  These repositories are being built now. Each is published once a person has reviewed its
  publisher's terms and it passes `pdt check`; the table links to the repository and its site
  when it is.
datasets:
