# Religion key for the full NSFG 2022-2023 public-use files (female 1,912 variables,
# male 1,156, pregnancy 110, as counted in the codebooks). Built by hand on 2026-11-19.
# Candidates: every variable in ../pdt-nsfg/data/raw/2022-2023-*-Codebook.txt whose label or
# universe matches a religion keyword, plus every item in the religion sections (female IC-3
# to IC-8, male JB-3 to JB-8). IC/JB-1, -2, -4 and -5 (religion raised, current religion as
# asked) aren't in the public files. "Against religion or morals" is a response code of
# another item, not a variable.
